name: sync-gps-raw

on:
  workflow_dispatch:

jobs:
  sync-gps-raw:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      MOOBIZ_SERVICES_TOKEN: ${{ secrets.MOOBIZ_SERVICES_TOKEN }}
      MOOBIZ_TOKEN: ${{ secrets.MOOBIZ_TOKEN }}
      MOOBIZ_EMAIL: ${{ secrets.MOOBIZ_EMAIL }}
      MOOBIZ_PASSWORD: ${{ secrets.MOOBIZ_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: npm ci
      - name: Preflight env check
        run: npm run check:env
      - name: Run driver live raw sync (Moobiz live/vehicles → driver_live_raw)
        run: npx --yes tsx scripts/sync_driver_live_raw.ts
