name: sync-history

on:
  schedule:
    - cron: "0 5,17 * * *"
  workflow_dispatch:

jobs:
  sync-history:
    runs-on: ubuntu-latest
    env:
      NORMAL_LIMIT_FIXED: "2000"
      NORMAL_PAGES_FIXED: "2"
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      MOOBIZ_TOKEN: ${{ secrets.MOOBIZ_TOKEN }}
      MOOBIZ_EMAIL: ${{ secrets.MOOBIZ_EMAIL }}
      MOOBIZ_PASSWORD: ${{ secrets.MOOBIZ_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: npm ci
      - name: Preflight env check
        run: npm run check:env
      - name: Run sync history
        run: node -r dotenv/config scripts/sync_moobiz_history.js
