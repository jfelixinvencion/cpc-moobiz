on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
name: Moobiz Sync

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        run: npm ci

      - name: Preflight env check
        run: npm run check:env

      - name: Run script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MOOBIZ_TOKEN: ${{ secrets.MOOBIZ_TOKEN }}
          MOOBIZ_EMAIL: ${{ secrets.MOOBIZ_EMAIL }}
          MOOBIZ_PASSWORD: ${{ secrets.MOOBIZ_PASSWORD }}
        run: node scripts/sync_moobiz_logs_incremental.js
